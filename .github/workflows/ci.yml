name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api:
    name: api-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/api-server/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci --forceExit

      - name: E2E contract tests
        run: npm run test:e2e -- --ci --forceExit
        env:
          DB_MODE: memory
          REDIS_ENABLED: 'false'
          MINIO_ENABLED: 'false'
          REVIEW_MODE: sync
          WECHAT_MODE: mock
          JWT_SECRET: ci-test-secret

      - name: OpenAPI coverage
        run: npm run openapi:coverage

      - name: Start API for load smoke
        env:
          PORT: '3000'
          DB_MODE: memory
          REDIS_ENABLED: 'false'
          MINIO_ENABLED: 'false'
          REVIEW_MODE: async
          WECHAT_MODE: mock
          JWT_SECRET: ci-test-secret
          AI_MOCK_MODE: auto_approve
        run: |
          npm run start:prod &
          echo $! > /tmp/api.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health >/dev/null; then
              echo "API up"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          exit 1

      - name: Load smoke
        run: npm run load:smoke -- http://127.0.0.1:3000 8 2

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then kill $(cat /tmp/api.pid) || true; fi
