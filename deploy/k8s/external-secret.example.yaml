# External Secrets Operator 示例（Sprint 9）
# 需集群已安装 ESO：https://external-secrets.io/
# 将敏感配置从云厂商密钥库同步到 K8s Secret
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: ticket-economy
spec:
  provider:
    # 示例：HashiCorp Vault；可换 AWS SM / GCP SM / Azure KV
    vault:
      server: "https://vault.example.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "ticket-economy"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-server-secret
  namespace: ticket-economy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: api-server-secret
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: ticket-economy/api
        property: jwt_secret
    - secretKey: MYSQL_USER
      remoteRef:
        key: ticket-economy/api
        property: mysql_user
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: ticket-economy/api
        property: mysql_password
    - secretKey: WECHAT_APPID
      remoteRef:
        key: ticket-economy/api
        property: wechat_appid
    - secretKey: WECHAT_SECRET
      remoteRef:
        key: ticket-economy/api
        property: wechat_secret
