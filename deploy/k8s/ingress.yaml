apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-server
  namespace: ticket-economy
  annotations:
    # nginx example; adjust for your ingress class
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: api.ticket-economy.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-server
                port:
                  number: 80
  # tls:
