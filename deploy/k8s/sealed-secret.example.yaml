# Sealed Secrets 示例说明（Sprint 9）
# 1. 安装: kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/...
# 2. 本地加密:
#    kubeseal --format yaml < secret.yaml > sealed-secret.yaml
# 3. 提交 sealed-secret.yaml 到 Git（密文可入库）
#
# 下方为结构示意（非可用密文）：
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: api-server-secret
  namespace: ticket-economy
spec:
  encryptedData:
    JWT_SECRET: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEQAx...
    MYSQL_PASSWORD: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEQAx...
  template:
    metadata:
      name: api-server-secret
      namespace: ticket-economy
    type: Opaque
